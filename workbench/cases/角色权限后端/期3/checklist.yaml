- name: phase34-scope
  run: "python3 - <<'CHECK'\nfrom pathlib import Path\nimport subprocess\nbase='4420d1b12'\n\
    source='b38493b07'\nroot=Path('ee/internal/rbac/host')\nassert not (root/'routes.json').exists()\n\
    assert not (root/'testdata/authorization-v4.json').exists()\nassert 'legacy-admin'\
    \ not in (root/'routes.txt').read_text()\nproduction={p.name for p in root.glob('*.go')\
    \ if not p.name.endswith('_test.go')}\nassert production=={'authorization.go','routes.go','request.go','response.go','providers.go','logs.go','webhooks.go','plugins.go','settings.go','notifications.go'}\n\
    for p in root.glob('*.go'): assert len(p.read_text().splitlines())<=500,p\nfor\
    \ folder in ['ee/internal/rbac/persistence','ee/internal/identity/persistence','ee/internal/rbac/http']:\n\
    \ for name in subprocess.check_output(['git','ls-tree','-r','--name-only',base,folder],text=True).splitlines():\n\
    \  if name.endswith('.go') and not name.endswith('_test.go'):\n   assert Path(name).read_bytes()==subprocess.check_output(['git','show',base+':'+name]),name\n\
    changed=subprocess.check_output(['git','diff','--name-only',base,'--','transports'],text=True).splitlines()\n\
    allowed={'consolepolicy.go','consolepolicy_test.go','config.go','notifications.go','webhooks.go','websocket.go'}\n\
    assert all(p.startswith('transports/bifrost-http/handlers/') and Path(p).name\
    \ in allowed for p in changed),changed\nprint('范围通过：十个主体文件；数据库与角色HTTP生产实现冻结；上游仅批准的六个文件；未导入大JSON')\n\
    CHECK\n"
