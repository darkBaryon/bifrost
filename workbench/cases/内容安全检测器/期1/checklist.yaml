必过命令:
  - name: ee-vet
    run: cd ee && GOWORK=off go vet ./...
  - name: ee-race
    run: cd ee && GOWORK=off go test -race ./...
  - name: ee-build
    run: cd ee && GOWORK=off go build -o tmp/bifrost-http ./cmd/bifrost-http
  - name: guardrails-format
    run: gofmt -l ee/internal/guardrails ee/internal/app
    expect_empty: true
  - name: guardrails-file-size
    run: find ee/internal/guardrails -name '*.go' -exec awk 'END{if(NR>500)print FILENAME}' {} \;
    expect_empty: true
  - name: diff-check
    run: git diff --check
  - name: workbench-views
    run: python3 workbench/tools/build_views.py --check
  - name: guardrails-http
    run: python3 ee/scripts/guardrails-smoke.py
必存产物:
  - ee/internal/guardrails/README.md
  - ee/internal/guardrails/detectors/secrets/detector.go
  - ee/internal/guardrails/detectors/secrets/data/rules.json
  - ee/internal/guardrails/detectors/secrets/data/NOTICE
  - ee/internal/guardrails/detectors/judge/detector.go
  - ee/internal/guardrails/detectors/judge/prompts
  - ee/internal/app/guardrails.go
必含符号:
  - {grep: 'func New', in: ee/internal/guardrails/detectors/secrets}
  - {grep: 'func New', in: ee/internal/guardrails/detectors/judge}
  - {grep: 'sk-bf-', in: ee/internal/guardrails/detectors/secrets}
  - {grep: 'BifrostContextKeySkipPluginPipeline', in: ee/internal/app}
收敛评审:
  风险等级: L2
  基线: fae2fe855
  开发指南:
    - ee/internal/guardrails/README.md
禁留标记:
  - {grep: 'net/http', in: ee/internal/guardrails}
  - {grep: 'fasthttp', in: ee/internal/guardrails}
  - {grep: 'core/schemas', in: ee/internal/guardrails/detectors}
  - {grep: 'gitleaks/v8', in: ee/go.mod}
