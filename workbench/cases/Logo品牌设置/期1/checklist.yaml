# Logo品牌设置期1统一检查清单：包含功能实现、布局整理和接口命名评审修改。
# 仅在 Gate 1 实施完成后运行；工作树就是交付物，不要求提交。
# 最终预飞HEAD包含已提交的独立Workbench规范更新；功能diff基线仍保留原8fd392958。
必过命令:
  - { name: branch, run: "test \"$(git branch --show-current)\" = feat/branding" }
  - { name: baseline, run: "test \"$(git rev-parse HEAD)\" = 60b143c73561b27360f56209af933b8bd9be2cd9" }
  - { name: unstaged-only, run: "git diff --cached --exit-code" }
  - { name: diff-check, run: "git diff --check" }
  - { name: research-preserved, run: "python3 -c \"import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('docs-zh/08-开发计划/04-Logo与轻量品牌定制产品调研.md').read_bytes()).hexdigest() == 'b604fcf50b6bd719813722c1dacd914a53788279a4e1cf64b01309b173a34e68'\"" }
  - name: allowed-paths
    run: |
      python3 - <<'PYCODE'
      import fnmatch, subprocess
      base = '8fd392958288016f5c97756cac7b5d5461699bca'
      tracked = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, '--']).decode().split('\0')
      new = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode().split('\0')
      allowed = [
        'ee/framework/configstore/branding/*',
        # 原基线中的这两份旧文件已删除，保留删除路径的白名单。
        'ee/transports/bifrost-http/handlers/branding.go', 'ee/transports/bifrost-http/handlers/branding_test.go',
        'ee/transports/bifrost-http/handlers/branding/*',
        'ee/transports/bifrost-http/lib/tables.go',
        'ee/transports/bifrost-http/server/bootstrap.go', 'ee/transports/bifrost-http/server/bootstrap_test.go',
        'ee/ui/app/enterprise/components/branding/*',
        'ee/ui/app/enterprise/lib/schemas/branding.ts', 'ee/ui/app/enterprise/lib/schemas/README.md', 'ee/scripts/branding-smoke.py',
        'ee/scripts/testdata/branding-icon.jpg', 'ee/scripts/smoke.sh',
        'ui/lib/store/apis/brandingApi.ts', 'ui/lib/store/apis/brandingApi.test.ts',
        'ui/lib/hooks/useBranding.ts', 'ui/lib/hooks/useBranding.test.ts',
        'ui/app/globals.css',
        # 浏览器本机证据不作为提交交付物，保留现场但在范围审计中显式区分。
        '.playwright-cli/*', 'output/playwright/*', 'output/branding-ui-polish/*',
        'docs-zh/04-开发指南/07-ee包壳.md', 'docs-zh/04-开发指南/08-Logo品牌设置.md',
        'workbench/evidence/Branding代码布局整理-期1-*', 'workbench/evidence/Branding接口命名调整-期1-*',
        'docs-zh/08-开发计划/04-Logo与轻量品牌定制产品调研.md',
        'workbench/reports/Logo品牌设置.md', 'workbench/cases/Logo品牌设置/*',
        'workbench/evidence/Logo品牌设置-期1-*', 'workbench/findings.md',
        'workbench/index.md', 'workbench/views/all.md', 'workbench/需求报告.md',
        'workbench/SUMMARY.md', 'workbench/assets/nav.js',
        # 同一工作树内并行的轻量级案「收敛评审代码质量职责」(triggered_by 本案) 的产物, 逐文件列出
        'workbench/reports/收敛评审代码质量职责.md',
        'workbench/templates/代码评审.md', 'workbench/templates/收敛评审.md',
        'workbench/规范/流程/交付.md', 'workbench/规范/流程/收敛评审.md', 'workbench/规范/流程.md',
        # 本轮开始前已存在的规范/评审文档改动，逐文件登记；本轮范围另由起点哈希核对。
        '.claude/skills/convergence-review/SKILL.md',
        'workbench/ADOPTION.md',
        'workbench/AGENTS.md',
        'workbench/README.md',
        'workbench/SCHEMA.md',
        'workbench/reports/工作台代码风格与评审指引.md',
        'workbench/templates/代码评审提示词.md',
        'workbench/templates/收敛评审提示词.md',
        'workbench/tools/build_views.py',
        'workbench/规范.md',
        'workbench/规范/差异/开发.md',
        'workbench/规范/差异/重构.md',
        'workbench/规范/机制/finding台账.md',
        'workbench/规范/机制/交付.md',
        'workbench/规范/机制/实施纪律.md',
        'workbench/规范/机制/收敛评审.md',
        'workbench/规范/机制/方案与复核.md',
        'workbench/规范/流程/finding台账.md',
        'workbench/规范/流程/代码评审审查方向.md',
        'workbench/规范/流程/实施纪律.md',
        'workbench/规范/流程/收敛评审审查方向.md',
        'workbench/规范/流程/方案与复核.md',
        'workbench/规范/项目/编码规范.md',

      ]
      bad = sorted(p for p in set(tracked + new) if p and not any(fnmatch.fnmatchcase(p, rule) for rule in allowed))
      assert not bad, 'out-of-scope changes: ' + repr(bad)
      PYCODE
  - name: go-format
    run: |
      python3 - <<'PYCODE'
      from pathlib import Path
      import subprocess
      roots = [Path('ee/framework/configstore')]
      paths = [str(p) for root in roots for p in root.rglob('*.go')]
      paths += [str(p) for p in Path('ee/transports/bifrost-http/handlers/branding').glob('*.go')]
      paths += [str(p) for p in Path('ee/transports/bifrost-http/server').glob('bootstrap*.go')]
      assert paths, 'no implementation files'
      result = subprocess.run(['gofmt', '-l', *paths], capture_output=True, text=True, check=True)
      assert not result.stdout.strip(), result.stdout
      PYCODE
  - name: ui-format
    run: "./ui/node_modules/.bin/oxfmt --config ui/.oxfmtrc.json --check ui/lib/hooks/useBranding.ts ui/lib/hooks/useBranding.test.ts ee/ui/app/enterprise/components/branding ee/ui/app/enterprise/lib/schemas/branding.ts ui/lib/store/apis/brandingApi.ts ui/lib/store/apis/brandingApi.test.ts"
  - { name: ee-build, run: "cd ee && GOWORK=off go build ./..." }
  - { name: ee-vet, run: "cd ee && GOWORK=off go vet ./..." }
  - { name: ee-test, run: "cd ee && GOWORK=off go test ./..." }
  - { name: ui-build, run: "make -C ee build-ui" }
  - { name: ui-typecheck, run: "cd ui && ./node_modules/.bin/tsc --noEmit && ./node_modules/.bin/tsc --noEmit -p ../ee/ui/tsconfig.json --types vite/client,node" }
  - { name: branding-ui-test, run: "cd ui && ./node_modules/.bin/vitest run lib/hooks/useBranding.test.ts app/enterprise/components/branding/image.test.ts lib/store/apis/brandingApi.test.ts" }
  - { name: binary, run: "cd ee && GOWORK=off go build -o tmp/bifrost-branding ./transports/bifrost-http" }
  - { name: restart-smoke, run: "python3 ee/scripts/branding-smoke.py --binary ee/tmp/bifrost-branding" }
  - { name: go-race, run: "cd ee && GOWORK=off go test -race ./framework/configstore/branding ./transports/bifrost-http/handlers/branding" }
  - { name: smoke-shell-syntax, run: "bash -n ee/scripts/smoke.sh" }
  - { name: workbench, run: "python3 workbench/tools/build_views.py --check" }
必存产物:
  - ee/framework/configstore/branding/table.go
  - ee/framework/configstore/branding/store.go
  - ee/framework/configstore/branding/migration.go
  - ee/transports/bifrost-http/handlers/branding/branding_test.go
  - ee/ui/app/enterprise/components/branding/brandingView.tsx
  - ee/scripts/branding-smoke.py
  - docs-zh/04-开发指南/08-Logo品牌设置.md
  - ui/lib/store/apis/brandingApi.test.ts
  - ee/framework/configstore/branding/README.md
  - ee/transports/bifrost-http/handlers/branding/README.md
  - ee/ui/app/enterprise/components/branding/README.md
  - ee/ui/app/enterprise/lib/schemas/README.md
必含符号:
  - { grep: "ee_branding_v1", in: "ee/framework/configstore" }
  - { grep: "APIMiddleware", in: "ee/transports/bifrost-http/server" }
禁留标记:
  - { grep: 'console.log("DEBUG', in: "ee/ui/app/enterprise/components/branding" }
