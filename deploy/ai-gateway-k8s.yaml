# SQLite 单副本部署模板，不需要独立数据库服务。
# 应用前替换 REPLACE_IMAGE_TAG，先按配套说明应用 ai-gateway-storage.yaml。
# 已确认使用块存储或本地磁盘 PVC，禁止将 SQLite WAL 放到 nfs-provisioner。
# 在 ai-tool 中预先创建 ai-gateway-auth 与 ai-gateway-registry Secret，见配套说明。
apiVersion: v1
kind: Namespace
metadata:
  name: ai-tool
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-tool
spec:
  replicas: 1
  # SQLite 更新时先停止旧实例；不要开启 HPA 或增加副本。
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
      imagePullSecrets:
        - name: ai-gateway-registry
      containers:
        - name: ai-gateway
          image: registry.cn-hangzhou.aliyuncs.com/yxdocker/ai-gateway:REPLACE_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8080"
            - name: APP_DIR
              value: /app/data
            - name: LOG_LEVEL
              value: info
            - name: LOG_STYLE
              value: json
            # 必须与浏览器实际访问的 HTTPS origin 一致，不带路径。
            - name: EE_PUBLIC_ORIGIN
              value: https://bifrost.zxiaowo.com
            - name: BIFROST_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-auth
                  key: BIFROST_SETUP_TOKEN
            - name: EE_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-auth
                  key: EE_INITIAL_PASSWORD
          resources:
            # 测试环境起始值，按实际请求量和集群容量调整。
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 12
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 12
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 12
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-gateway-data
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: ai-tool
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
