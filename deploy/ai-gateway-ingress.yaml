# 适配当前 Kubernetes 1.14.2 和 nginx-ingress-controller 0.24.1。
# 先在 ai-tool 中准备 ai-gateway-tls，见部署步骤；已有外部反代时可不应用。
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: ai-gateway
  namespace: ai-tool
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  tls:
    - hosts:
        - bifrost.zxiaowo.com
      secretName: zxiaowo
  rules:
    - host: bifrost.zxiaowo.com
      http:
        paths:
          - path: /
            backend:
              serviceName: ai-gateway
              servicePort: 8080
